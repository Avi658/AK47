```
name: Build CV
on:
  push:
    branches:
      - main
  workflow_dispatch: # To be able to trigger this workflow manually

permissions:
  contents: write
  
jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm /var/lib/man-db/auto-update
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v7

        # for consistent rendering
      - name: Install fonts 
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - run: google-chrome --version

      - name: Render resume to PDF
        run: |
          google-chrome \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=10000 \
            --no-pdf-header-footer \
            --print-to-pdf=Aviv_Katz_CV.pdf \
            "$(pwd)/raw/Aviv_Katz_CV.html"

      - name: debug (pwd)
        run: ls -Alh

      - name: debug (raw)
        run: ls -Alh raw/

      - name: Create GitHub Release and upload PDF
        uses: softprops/action-gh-release@v2
        with:
          files: Aviv_Katz_CV.pdf
          generate_release_notes: true
          tag_name: CV-${{ github.sha }}
```
